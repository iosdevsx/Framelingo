        Object.entries(attrs).forEach(([key, value]) =&gt; element.setAttribute(key, String(value)));
        return element;
      };

      const dependentsOf = name =&gt; edges.filter(edge =&gt; edge.target === name).map(edge =&gt; edge.source).sort();
      const dependenciesOf = name =&gt; (internal[name] || []).slice().sort();

      groups.forEach(group =&gt; {
        const optgroup = document.createElement('optgroup');
        optgroup.label = group.label;
        group.nodes.forEach(name =&gt; {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          optgroup.appendChild(option);
        });
        select.appendChild(optgroup);
      });

      const updateSelection = name =&gt; {
        selected = name;
        select.value = name;
        const deps = new Set(name ? dependenciesOf(name) : []);
        const users = new Set(name ? dependentsOf(name) : []);

        nodeElements.forEach((element, nodeName) =&gt; {
          element.classList.toggle('is-selected', nodeName === name);
          element.classList.toggle('is-dependency', deps.has(nodeName));
          element.classList.toggle('is-dependent', users.has(nodeName));
          element.classList.toggle('is-dimmed', Boolean(name) &amp;&amp; nodeName !== name &amp;&amp; !deps.has(nodeName) &amp;&amp; !users.has(nodeName));
        });

        edgeElements.forEach(({ edge, element }) =&gt; {
          const dependency = edge.source === name;
          const dependent = edge.target === name;
          element.classList.toggle('is-dependency', dependency);
          element.classList.toggle('is-dependent', dependent);
          element.classList.toggle('is-dimmed', Boolean(name) &amp;&amp; !dependency &amp;&amp; !dependent);
        });

        if (!name) {
          detail.innerHTML = 'Стрелка &lt;strong&gt;A → B&lt;/strong&gt; означает: модуль A зависит от модуля B. Выберите узел, чтобы отделить прямые зависимости от потребителей.';
          return;
        }

        const depText = dependenciesOf(name).length ? dependenciesOf(name).join(', ') : 'нет';
        const userText = dependentsOf(name).length ? dependentsOf(name).join(', ') : 'нет';
        detail.innerHTML = `&lt;strong&gt;${name}&lt;/strong&gt; · зависимости: ${depText}&lt;br&gt;Потребители: ${userText}`;
      };

      const draw = () =&gt; {
        const width = Math.max(320, Math.round(diagram.getBoundingClientRect().width));
        const side = width &lt; 440 ? 12 : 18;
        const gapX = width &lt; 440 ? 8 : 12;
        const gapY = 10;
        const labelHeight = 24;
        const nodeHeight = width &lt; 440 ? 42 : 36;
        const desiredNodeWidth = width &gt;= 900 ? 146 : width &gt;= 600 ? 134 : 140;
        const maxCols = Math.max(2, Math.floor((width - side * 2 + gapX) / (desiredNodeWidth + gapX)));
        const nodeWidth = Math.min(desiredNodeWidth, (width - side * 2 - gapX * (maxCols - 1)) / maxCols);
        const sectionGap = 22;
        let y = 12;
        positions = new Map();

        groups.forEach(group =&gt; {
          const cols = Math.min(maxCols, group.nodes.length);
          const rows = Math.ceil(group.nodes.length / cols);
          const usedWidth = cols * nodeWidth + (cols - 1) * gapX;
          const startX = (width - usedWidth) / 2;
          const labelY = y + 12;
          y += labelHeight;

          group.nodes.forEach((name, index) =&gt; {
            const row = Math.floor(index / cols);
            const col = index % cols;
            const itemsInRow = Math.min(cols, group.nodes.length - row * cols);
            const rowWidth = itemsInRow * nodeWidth + (itemsInRow - 1) * gapX;
            const rowStartX = (width - rowWidth) / 2;
            positions.set(name, {
              x: rowStartX + col * (nodeWidth + gapX),
              y: y + row * (nodeHeight + gapY),
              width: nodeWidth,
              height: nodeHeight,
              color: group.color,
              labelY
            });
          });
          y += rows * nodeHeight + Math.max(0, rows - 1) * gapY + sectionGap;
        });

        const height = y + 8;
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        svg.setAttribute('height', String(height));
        diagram.style.minHeight = `${height}px`;
        svg.querySelectorAll(':scope &gt; g').forEach(element =&gt; element.remove());

        const edgeLayer = appendSVG('g', { 'aria-hidden': 'true' });
        const labelLayer = appendSVG('g', { 'aria-hidden': 'true' });
        const nodeLayer = appendSVG('g');
        svg.append(edgeLayer, labelLayer, nodeLayer);

        const defs = appendSVG('defs');
        const marker = appendSVG('marker', { id: 'fdg-arrow', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '5', markerHeight: '5', orient: 'auto-start-reverse' });
        const markerPath = appendSVG('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'var(--border)' });
        marker.appendChild(markerPath);
        defs.appendChild(marker);
        svg.insertBefore(defs, edgeLayer);

        groups.forEach(group =&gt; {
          const first = positions.get(group.nodes[0]);
          const text = appendSVG('text', { x: side, y: first.labelY, class: 'fdg-group-label' });
          text.textContent = group.label;
          labelLayer.appendChild(text);
        });

        edgeElements = edges.map(edge =&gt; {
          const source = positions.get(edge.source);
          const target = positions.get(edge.target);
          const sx = source.x + source.width / 2;
          const sy = source.y + source.height;
          const tx = target.x + target.width / 2;
          const targetBelow = target.y &gt;= source.y;
          const ty = targetBelow ? target.y : target.y + target.height;
          const sourceY = targetBelow ? sy : source.y;
          const bend = Math.max(28, Math.abs(ty - sourceY) * 0.42);
          const c1y = targetBelow ? sourceY + bend : sourceY - bend;
          const c2y = targetBelow ? ty - bend : ty + bend;
          const path = appendSVG('path', {
            d: `M ${sx} ${sourceY} C ${sx} ${c1y}, ${tx} ${c2y}, ${tx} ${ty}`,
            class: 'fdg-edge',
            'marker-end': 'url(#fdg-arrow)'
          });
          edgeLayer.appendChild(path);
          return { edge, element: path };
        });

        nodeElements = new Map();
        nodes.forEach(node =&gt; {
          const position = positions.get(node.name);
          const group = appendSVG('g', {
            class: 'fdg-node',
            role: 'button',
            'aria-label': `${node.name}: ${dependenciesOf(node.name).length} зависимостей, ${dependentsOf(node.name).length} потребителей`,
            transform: `translate(${position.x} ${position.y})`,
            style: `--fdg-color: var(${position.color})`
          });
          const rect = appendSVG('rect', { width: position.width, height: position.height, rx: 7 });
          const text = appendSVG('text', { x: position.width / 2, y: nodeHeight / 2, 'text-anchor': 'middle' });
          const parts = node.name.replace(/([a-z0-9])([A-Z])/g, '$1 $2').split(' ');
          const shouldWrap = node.name.length * 6.2 &gt; position.width - 12 &amp;&amp; parts.length &gt; 1;
          if (shouldWrap) {
            let bestIndex = 1;
            let bestBalance = Infinity;
            for (let index = 1; index &lt; parts.length; index += 1) {
              const firstLength = parts.slice(0, index).join('').length;
              const secondLength = parts.slice(index).join('').length;
              const balance = Math.max(firstLength, secondLength);
              if (balance &lt; bestBalance) {
                bestBalance = balance;
                bestIndex = index;
              }
            }
            const firstLine = appendSVG('tspan', { x: position.width / 2, dy: '-0.25em' });
            firstLine.textContent = parts.slice(0, bestIndex).join('');
            const secondLine = appendSVG('tspan', { x: position.width / 2, dy: '1.15em' });
            secondLine.textContent = parts.slice(bestIndex).join('');
            text.append(firstLine, secondLine);
          } else {
            text.setAttribute('dominant-baseline', 'central');
            text.textContent = node.name;
          }
          group.append(rect, text);
          group.addEventListener('click', () =&gt; updateSelection(selected === node.name ? '' : node.name));
          group.addEventListener('keydown', event =&gt; {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              updateSelection(selected === node.name ? '' : node.name);
            }
          });
          nodeLayer.appendChild(group);
          nodeElements.set(node.name, group);
        });

        updateSelection(selected);
      };

      select.addEventListener('change', event =&gt; updateSelection(event.target.value));
      const observer = new ResizeObserver(draw);
      observer.observe(diagram);
      draw();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
