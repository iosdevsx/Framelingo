name: Refresh Architecture Site

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: refresh-architecture-site-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh snapshots
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ARCHITECTURE_BOT_TOKEN || github.token }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Tools/ArchitectureSite/package-lock.json

      - name: Regenerate architecture snapshots
        run: ruby Scripts/architecture/export-site-data.rb

      - name: Install architecture site dependencies
        working-directory: Tools/ArchitectureSite
        run: npm ci

      - name: Validate architecture site
        working-directory: Tools/ArchitectureSite
        run: npm run build

      - name: Detect snapshot changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            docs/architecture/framelingo-architecture.json \
            Tools/ArchitectureSite/app/architecture-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed snapshots to main
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/architecture/framelingo-architecture.json \
            Tools/ArchitectureSite/app/architecture-data.json
          git commit -m "chore(architecture): refresh snapshots [skip ci]"
          git push origin HEAD:main
