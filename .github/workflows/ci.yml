name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Legacy Xcode project (parity reference)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select exact Xcode 26.3
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=""
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode-26.3.app; do
            if [[ -d "$candidate" ]]; then
              XCODE_APP="$candidate"
              break
            fi
          done
          if [[ -z "$XCODE_APP" ]]; then
            echo "Xcode 26.3 is not installed on this runner." >&2
            ls -1d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          [[ "$(xcodebuild -version | sed -n '1s/^Xcode //p')" == "26.3" ]]
          xcodebuild -version

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Framelingo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Audit module boundaries
        run: ruby Scripts/audit-module-boundaries.rb --self-test

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Framelingo \
            -testPlan TestPlan \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            | xcbeautify

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
